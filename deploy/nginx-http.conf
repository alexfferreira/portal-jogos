# Recreio em uma VPS com nginx, ETAPA A: só HTTP (porta 80).
#
# Serve para emitir o certificado do Let's Encrypt (o desafio precisa de um site respondendo na
# porta 80). Depois de emitir, troque este arquivo por deploy/nginx.conf (etapa B, com HTTPS).
# Passo a passo no README, seção "VPS com nginx".
#
# Copie para /etc/nginx/conf.d/recreio.conf e troque "recreio.example.com" pelo seu domínio.
server {
    listen 80;
    listen [::]:80;
    server_name recreio.example.com;
    server_tokens off;

    root /var/www/recreio;
    index index.html;

    # Desafio do certbot (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Arquivos ocultos nunca são servidos (o desafio acima é tratado antes, por ^~).
    location ~ /\. {
        return 404;
    }

    # Já serve o site (só para conferir que o domínio e o nginx estão certos).
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri /200.html;
    }
}
