# Cabeçalhos de segurança do Recreio (espelham a regra "/(.*)" do vercel.json).
#
# Este arquivo é incluído (`include`) em CADA `location` de deploy/nginx.conf. Motivo: no nginx,
# um `add_header` dentro de um `location` ANULA todos os `add_header` herdados do `server`; por
# isso a lista precisa ser repetida em cada bloco (o include evita copiar e colar).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
