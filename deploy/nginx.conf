# Recreio em uma VPS com nginx: serve o build estático (apps/portal/build) na RAIZ do domínio.
# ETAPA B (definitiva, com HTTPS). Antes dela use deploy/nginx-http.conf para emitir o certificado.
#
# Política idêntica à do vercel.json (a referência é o vercel.json; scripts/deploy.test.ts confere
# as diretivas essenciais deste arquivo):
#   - service-worker.js, manifest.webmanifest, HTML e _app/version.json: Cache-Control no-cache
#   - /_app/immutable/**: public, max-age=31536000, immutable
#   - ícones e favicon: 1 dia
#   - "/" entrega index.html; outras rotas do app (sem extensão) caem em /200.html;
#     arquivo inexistente = 404 (nunca HTML)
#
# Instalação (resumo; o passo a passo está no README, seção "VPS com nginx"):
#   1. Copie o conteúdo de apps/portal/build para /var/www/recreio
#   2. Copie deploy/recreio-headers.conf para /etc/nginx/snippets/recreio-headers.conf
#   3. Etapa A: use deploy/nginx-http.conf, emita o certificado com o certbot
#   4. Etapa B: copie ESTE arquivo para /etc/nginx/conf.d/recreio.conf, troque
#      "recreio.example.com" pelo seu domínio e rode: sudo nginx -t && sudo systemctl reload nginx
#
# Compressão: gzip abaixo funciona em qualquer nginx. Brotli exige o módulo ngx_brotli (opcional,
# linhas comentadas). O JS/CSS do build tem hash no nome, então o cache longo é seguro.

# HTTP: só responde ao desafio do Let's Encrypt e redireciona o resto para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name recreio.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # nginx >= 1.25.1; em versões antigas use "listen 443 ssl http2;" no lugar
    server_name recreio.example.com;
    server_tokens off;

    # Certificados emitidos pelo certbot (sudo certbot certonly --webroot -w /var/www/certbot -d ...).
    ssl_certificate     /etc/letsencrypt/live/recreio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recreio.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/recreio;
    index index.html;

    # Tipos: o mime.types do nginx já cobre js, css, woff2, png, svg, ico e wasm. O manifest
    # recebe o tipo certo no próprio location (abaixo). `.js` como módulo = text/javascript
    # (nginx recente) ou application/javascript (antigo): ambos valem para <script type=module>.
    include mime.types;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml image/x-icon application/wasm;

    # brotli on;                       # requer ngx_brotli
    # brotli_comp_level 5;
    # brotli_types text/css text/javascript application/javascript application/json
    #              application/manifest+json image/svg+xml application/wasm;

    # Arquivos ocultos (.git, .env...) nunca são servidos. O desafio do certbot fica na porta 80.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Página inicial: index.html (mesmo comportamento da Vercel e do pnpm serve).
    location = / {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Service worker: sempre revalidar, senão o navegador demora a ver uma versão nova.
    location = /service-worker.js {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # O SvelteKit consulta este arquivo para saber se há deploy novo.
    location = /_app/version.json {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Arquivos com hash no nome: nunca mudam, cache de um ano. Inexistente = 404, nunca HTML.
    location ^~ /_app/immutable/ {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Qualquer outra coisa em /_app/ que não exista também é 404.
    location ^~ /_app/ {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Ícones e favicon: cache moderado (1 dia), sem immutable.
    location ~* ^/(icon-.*\.png|apple-touch-icon\.png|favicon\.(ico|svg))$ {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Qualquer outro caminho COM extensão (ex.: /algo.png, /200.html): é arquivo ou 404.
    location ~ \.[^/]+$ {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Rotas do app (/jogo/mistura, /configuracoes, desconhecidas): sem extensão, caem no 200.html.
    location / {
        include /etc/nginx/snippets/recreio-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /200.html;
    }
}
